name: AURORA CORE CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff numpy
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Run tests
        run: |
          pytest tests/ --tb=short -q \
            --ignore=tests/test_m8_5_integrity.py \
            --ignore=tests/test_metrics.py \
            --ignore=tests/test_metrics_expanded.py \
            --ignore=tests/test_phase7_validation.py \
            --ignore=tests/test_phase8b_m1.py \
            --ignore=tests/test_phase8b_m2.py \
            --ignore=tests/test_phase8b_m3.py \
            --ignore=tests/test_phase8b_m4.py \
            --ignore=tests/test_phase8b_m5.py \
            --ignore=tests/test_phase8b_m6.py \
            --ignore=tests/test_phase9.py \
            --ignore=tests/test_phase10.py \
            --ignore=tests/test_phase11.py \
            --ignore=tests/test_phase12.py \
            --ignore=tests/test_phase13.py \
            --ignore=tests/test_phase14.py \
            --ignore=tests/test_phase15.py \
            --ignore=tests/test_pipeline.py \
            --ignore=tests/test_stub_adapter.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-fund --no-audit
      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
